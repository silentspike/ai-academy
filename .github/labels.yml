# Label schema — AI-Academy
# Single source of truth. Synced by .github/workflows/labels.yml (EndBug/label-sync).
# Edit this file, never the labels in the web interface.

# --- Type -------------------------------------------------------------------
- name: "type:epic"
  color: "5319e7"
  description: "Parent issue for grouped stories"
- name: "type:feature"
  color: "a2eeef"
  description: "New feature or enhancement"
- name: "type:bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type:content"
  color: "8250df"
  description: "Learning content: error, gap, improvement"
- name: "type:legal"
  color: "b60205"
  description: "Legal baseline, citation, interpretation"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:refactor"
  color: "fef2c0"
  description: "Code refactoring"
- name: "type:perf"
  color: "f9d0c4"
  description: "Performance improvement"
- name: "type:ci"
  color: "e6e6e6"
  description: "CI/CD changes"
- name: "type:deps"
  color: "0366d6"
  description: "Dependency updates"
- name: "type:security"
  color: "b60205"
  description: "Security fixes"
- name: "type:chore"
  color: "6e7781"
  description: "Non-feature maintenance"

# --- Status -----------------------------------------------------------------
- name: "status:triage"
  color: "fbca04"
  description: "Needs triage"
- name: "status:backlog"
  color: "eeeeee"
  description: "Accepted, not prioritised"
- name: "status:ready"
  color: "0e8a16"
  description: "Ready for development"
- name: "status:in-progress"
  color: "1d76db"
  description: "Currently being worked on"
- name: "status:review"
  color: "1d76db"
  description: "In review (PR open)"
- name: "status:blocked"
  color: "b60205"
  description: "Blocked by dependency"
- name: "status:completed"
  color: "238636"
  description: "Work completed"
- name: "status:verified"
  color: "238636"
  description: "All acceptance criteria verified with evidence"

# --- Priority ---------------------------------------------------------------
- name: "priority:critical"
  color: "b60205"
  description: "Must be fixed immediately"
- name: "priority:high"
  color: "d93f0b"
  description: "High priority"
- name: "priority:medium"
  color: "fbca04"
  description: "Medium priority"
- name: "priority:low"
  color: "c5def5"
  description: "Low priority"

# --- Size -------------------------------------------------------------------
- name: "size:S"
  color: "0e8a16"
  description: "< 1 day"
- name: "size:M"
  color: "fbca04"
  description: "1-3 days"
- name: "size:L"
  color: "d93f0b"
  description: "3-5 days"
- name: "size:XL"
  color: "b60205"
  description: "> 5 days (split required)"

# --- Scope ------------------------------------------------------------------
- name: "scope:full"
  color: "1f6feb"
  description: "Full scope delivery expected"
- name: "scope:experimental"
  color: "db6d28"
  description: "Prototype/placeholder allowed"

# --- Issue quality ----------------------------------------------------------
- name: "quality:needs-spec"
  color: "b60205"
  description: "Specification incomplete, not ready"
- name: "quality:ready"
  color: "238636"
  description: "Spec + acceptance criteria + verification complete"
- name: "quality:needs-evidence"
  color: "d29922"
  description: "Implementation present, evidence incomplete"

# --- Component --------------------------------------------------------------
- name: "comp:engine"
  color: "c5def5"
  description: "app/ — router, quiz, widgets, dialogue"
- name: "comp:bridge"
  color: "c5def5"
  description: "bridge/ — local service and model connection"
- name: "comp:content"
  color: "c5def5"
  description: "content/ — learning material"
- name: "comp:tests"
  color: "c5def5"
  description: "Test suite and workflows"
