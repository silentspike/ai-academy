name: Feature request
description: An idea for functionality, content or didactics
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should be solved
      description: Please describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Learning content
        - Didactics or exam logic
        - Interface and interaction
        - Bridge or model connection
        - Test suite and workflows
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: legal
    attributes:
      label: Legal relevance
      options:
        - label: This concerns a legal statement. I understand that a citation from the Official Journal is required.
