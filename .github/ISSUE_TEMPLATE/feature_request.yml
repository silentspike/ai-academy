name: Verbesserung vorschlagen
description: Eine Idee für Funktion, Inhalt oder Didaktik
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden
      description: Bitte das Problem beschreiben, nicht die Lösung.
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Vorschlag
    validations:
      required: true
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      options:
        - Lerninhalte
        - Didaktik oder Prüfungslogik
        - Oberfläche und Bedienung
        - Bridge oder Anbindung des Modells
        - Prüfstrecke und Arbeitsabläufe
        - Dokumentation
    validations:
      required: true
  - type: checkboxes
    id: rechtsbezug
    attributes:
      label: Rechtsbezug
      options:
        - label: Der Vorschlag betrifft eine rechtliche Aussage. Mir ist bewusst, dass dafür eine Fundstelle im Amtsblatt nötig ist.
