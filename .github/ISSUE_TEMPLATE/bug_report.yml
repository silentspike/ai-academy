name: Bug report
description: Something does not work as described
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report security issues here** — use
        Security → Report a vulnerability (see SECURITY.md).
  - type: textarea
    id: observation
    attributes:
      label: What happens
      description: What did you observe, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Started the bridge with ...
        2. Navigated to #/...
        3. Clicked ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options:
        - Bridge serves the application itself
        - Own web server, bridge behind a proxy path
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "browser and version, operating system, Node version, commit or release"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Please do not paste personal data.
      render: text
