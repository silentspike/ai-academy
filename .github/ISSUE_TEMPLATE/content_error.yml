name: Content or legal error
description: A statement in the learning material is wrong, outdated or unsourced
labels: ["type:content", "priority:high", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Errors in the legal material take precedence. A wrong statement can lead
        someone to give wrong advice at work — please be as precise as you can.
  - type: input
    id: location
    attributes:
      label: Where the statement appears
      placeholder: "unit, question identifier or screen area"
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Citation from the Official Journal with article and paragraph, ideally with the version.
      placeholder: "Art. 111(2) second sentence as amended by Regulation (EU) 2026/1744"
    validations:
      required: true
