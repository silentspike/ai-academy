name: ci

# Runs on GitHub-hosted runners only.
#
# Gate structure (see TESTING.md):
#   lint      — syntax, hygiene, hidden-character check    (seconds)
#   content   — schema, citations, figures and dates       (seconds)
#   unit      — engine, gamification, exam, onboarding     (seconds)
#   ci-pass   — aggregate, the single required check
#
# The aggregate exists so that branch protection does not have to be touched
# every time a job is added or renamed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }

      - name: Syntax check
        # Direct call rather than through npm: the wrapper adds about half a
        # second of process overhead to a check that itself takes 200 ms.
        run: node --experimental-vm-modules --no-warnings tools/syntax-check.mjs

      - name: Hidden Unicode / bidi characters
        # CVE-2021-42574: invisible direction marks can make source read
        # differently from how it executes.
        run: |
          if grep -rPl '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]' \
            --include='*.js' --include='*.mjs' --include='*.json' \
            --include='*.yml' --include='*.md' --include='*.html' \
            --include='*.css' --include='*.sh' \
            app/ public/ content/ bridge/ tutor/ tools/ scripts/ .github/ 2>/dev/null; then
            echo "::error::Hidden Unicode/bidi characters found in the files listed above."
            exit 1
          fi
          echo "clean"

      - name: Repository hygiene
        # Structural check without naming anything — a public log must not leak
        # what it protects.
        run: |
          fail=0
          for forbidden in data legal; do
            if git ls-files --error-unmatch "$forbidden" > /dev/null 2>&1; then
              echo "::error::'$forbidden/' is versioned — it must never enter a public repository."
              fail=1
            fi
          done
          if git ls-files | grep -qE '(^|/)\.(env|private-terms)$|\.(key|pem)$'; then
            echo "::error::A secret-like file is versioned."
            fail=1
          fi
          exit $fail

      - name: Forbidden API key environment names
        # Access runs through the vendor CLI sign-in only. A key path must not
        # return. This rule is itself no secret.
        run: |
          ! grep -RniE "ANTHROPIC_API_KEY|OPENAI_API_KEY|GEMINI_API_KEY" \
            --include="*.json" --include="*.js" --include="*.mjs" --include="*.html" \
            --include="*.service" --include="*.sh" --include="*.bat" \
            --exclude=build-release.mjs \
            app/ public/ content/ bridge/ tutor/ tools/ scripts/ 2>/dev/null

      - name: Protected terms (pattern from secret, not from the repository)
        env:
          PRIVATE_TERMS_REGEX: ${{ secrets.PRIVATE_TERMS_REGEX }}
        run: |
          if [ -z "$PRIVATE_TERMS_REGEX" ]; then
            echo "::notice::PRIVATE_TERMS_REGEX not set — step skipped."
            exit 0
          fi
          # Report locations only, never the line: this log is public.
          if grep -RniE "$PRIVATE_TERMS_REGEX" \
               --include="*.json" --include="*.js" --include="*.mjs" --include="*.html" \
               --include="*.md" --include="*.yml" --include="*.service" --include="*.sh" \
               app/ public/ content/ bridge/ tutor/ tools/ scripts/ docs/ *.md 2>/dev/null \
               | cut -d: -f1,2 > /tmp/hits; then
            echo "::error::Protected terms found (locations only, content deliberately not logged):"
            head -20 /tmp/hits
            exit 1
          fi
          echo "clean"

  content:
    name: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - name: Schema and mandatory fields
        run: node tools/validate-content.mjs
      - name: Figures, dates and citations
        run: node tools/check-questions.mjs

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - name: Unit tests
        run: npm run test:unit

      - name: Fuzz the JSON extractor
        # The most exposed parser in the product: it receives whatever the model
        # emits. Four real failure modes have already occurred in operation.
        run: npm run test:fuzz

  ci-pass:
    name: ci-pass
    runs-on: ubuntu-latest
    needs: [lint, content, unit]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "::error::At least one gate did not pass."
            exit 1
          fi
          echo "All gates passed."
