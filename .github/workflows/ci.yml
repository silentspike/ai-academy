name: ci

# Runs on GitHub-hosted runners only.
#
# Gate structure (see TESTING.md):
#   lint      — syntax, hygiene, hidden-character check    (seconds)
#   content   — schema, citations, figures and dates       (seconds)
#   unit      — engine, gamification, exam, onboarding     (seconds)
#   ci-pass   — aggregate, the single required check
#
# The aggregate exists so that branch protection does not have to be touched
# every time a job is added or renamed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }

      - name: Syntax check
        # Direct call rather than through npm: the wrapper adds about half a
        # second of process overhead to a check that itself takes 200 ms.
        run: node --experimental-vm-modules --no-warnings tools/syntax-check.mjs

      - name: Hidden Unicode / bidi characters
        # CVE-2021-42574: invisible direction marks can make source read
        # differently from how it executes.
        run: |
          if grep -rPl '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]' \
            --include='*.js' --include='*.mjs' --include='*.json' \
            --include='*.yml' --include='*.md' --include='*.html' \
            --include='*.css' --include='*.sh' \
            app/ public/ content/ bridge/ tutor/ tools/ scripts/ .github/ 2>/dev/null; then
            echo "::error::Hidden Unicode/bidi characters found in the files listed above."
            exit 1
          fi
          echo "clean"

      - name: Repository hygiene
        # Structural check without naming anything — a public log must not leak
        # what it protects.
        run: |
          fail=0
          for forbidden in data legal; do
            if git ls-files --error-unmatch "$forbidden" > /dev/null 2>&1; then
              echo "::error::'$forbidden/' is versioned — it must never enter a public repository."
              fail=1
            fi
          done
          if git ls-files | grep -qE '(^|/)\.(env|private-terms)$|\.(key|pem)$'; then
            echo "::error::A secret-like file is versioned."
            fail=1
          fi
          exit $fail

      - name: Forbidden API key environment names
        # Access runs through the vendor CLI sign-in only. A key path must not
        # return. This rule is itself no secret.
        run: |
          ! grep -RniE "ANTHROPIC_API_KEY|OPENAI_API_KEY|GEMINI_API_KEY" \
            --include="*.json" --include="*.js" --include="*.mjs" --include="*.html" \
            --include="*.service" --include="*.sh" --include="*.bat" \
            --exclude=build-release.mjs \
            app/ public/ content/ bridge/ tutor/ tools/ scripts/ 2>/dev/null

      - name: Protected terms (pattern from secret, not from the repository)
        env:
          PRIVATE_TERMS_REGEX: ${{ secrets.PRIVATE_TERMS_REGEX }}
        run: |
          if [ -z "$PRIVATE_TERMS_REGEX" ]; then
            echo "::notice::PRIVATE_TERMS_REGEX not set — step skipped."
            exit 0
          fi
          # Report locations only, never the line: this log is public.
          if grep -RniE "$PRIVATE_TERMS_REGEX" \
               --include="*.json" --include="*.js" --include="*.mjs" --include="*.html" \
               --include="*.md" --include="*.yml" --include="*.service" --include="*.sh" \
               app/ public/ content/ bridge/ tutor/ tools/ scripts/ docs/ *.md 2>/dev/null \
               | cut -d: -f1,2 > /tmp/hits; then
            echo "::error::Protected terms found (locations only, content deliberately not logged):"
            head -20 /tmp/hits
            exit 1
          fi
          echo "clean"

  content:
    name: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - name: Schema and mandatory fields
        run: node tools/validate-content.mjs
      - name: Figures, dates and citations
        run: node tools/check-questions.mjs

      - name: Unit index is up to date
        # The index is derived from the unit files; a stale one silently breaks
        # the article map, which reads its links from it.
        run: node tools/build-unit-index.mjs --check

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - name: Unit tests
        run: npm run test:unit

      - name: Fuzz the JSON extractor
        # The most exposed parser in the product: it receives whatever the model
        # emits. Four real failure modes have already occurred in operation.
        run: npm run test:fuzz

  # The operation simulation. Sharded across runners: the sweep operates every
  # control on every route and is serial by nature, so the only way to make it
  # fast is more machines — which is exactly what a public repository gets for
  # free.
  e2e:
    name: e2e (chromium ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run shard
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4
      - name: Keep the click coverage of this shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-chromium-${{ matrix.shard }}
          path: .tmp-coverage/
          retention-days: 3
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The visual record plus contact sheets. Not a pass/fail on design — the sheets
  # are what a person looks at, and the heuristics point at frames worth a second
  # look (a view that rendered nothing, one that is almost one colour, one far
  # darker than its neighbours). The window size is the one hard check: a
  # screenshot at the wrong size makes every judgement based on it worthless.
  views:
    name: views (contact sheets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture the views
        run: npx playwright test --project=visual
      - name: Build the sheets
        run: node tools/contact-sheet.mjs --out test-results/kontaktbogen
      - name: Put the findings in the run summary
        if: always()
        run: cat test-results/kontaktbogen/BEFUND.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the sheets and the originals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contact-sheets
          path: |
            test-results/kontaktbogen/
            test-results/ansichten/
          retention-days: 14

  # A second engine, on the part where engines actually differ: layout, storage,
  # focus, dates. Running the full sweep here would double the wall clock without
  # finding more — measured once against the complete suite.
  e2e-firefox:
    name: e2e (firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Run
        run: npx playwright test --project=firefox
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-firefox
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Click coverage across all shards. No single shard sees the whole inventory,
  # so the evaluation happens here rather than inside a test.
  coverage:
    name: click coverage
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - name: Collect the shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-chromium-*
          merge-multiple: true
          path: .tmp-coverage
      - name: Evaluate
        run: node tools/coverage-report.mjs .tmp-coverage --markdown coverage.md
      - name: Put it in the run summary
        if: always()
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true

  ci-pass:
    name: ci-pass
    runs-on: ubuntu-latest
    needs: [lint, content, unit, e2e, e2e-firefox, coverage, views]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "::error::At least one gate did not pass."
            exit 1
          fi
          echo "All gates passed."
