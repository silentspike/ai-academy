name: release

on:
  push:
    tags: ["v*"]

# Least privilege at workflow level; the job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build once, start it everywhere, publish last. Until now the package was
  # unpacked and started on Linux only — for a product whose README promises
  # Linux, macOS and Windows. The owner has none of the other two; these runners
  # are where they exist.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }

      - name: Build package (schema, legal audit, protected-term scan)
        env:
          PRIVATE_TERMS_REGEX: ${{ secrets.PRIVATE_TERMS_REGEX }}
        run: node tools/build-release.mjs --version "${GITHUB_REF_NAME}" --out dist

      - name: Check the package is complete
        # Structure only — starting it is the next job's business, on every
        # system the package is offered to rather than on this one.
        run: |
          set -e
          mkdir -p pruefung && cd pruefung
          ZIP=$(ls ../dist/*.zip | head -1)
          unzip -q "$ZIP"
          PAKET=$(ls -d */ | head -1)
          cd "$PAKET"
          test -f bridge/bridge.mjs || { echo "bridge/bridge.mjs fehlt im Paket"; exit 1; }
          test -f tools/plattform-start.mjs || { echo "tools/plattform-start.mjs fehlt im Paket"; exit 1; }
          # One start script per platform, and the two shell ones executable —
          # a .command without the bit does nothing when double-clicked.
          for f in start.sh start.command start.bat; do
            test -f "$f" || { echo "$f fehlt im Paket"; exit 1; }
          done
          test -x start.sh && test -x start.command || { echo "chmod +x fehlt an start.sh/start.command"; exit 1; }
          bash -n start.sh && bash -n start.command
          echo "Paket vollständig."

      - name: Keep the package for the platform checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-paket
          path: dist/*.zip
          retention-days: 1

  # The package that ships, started on every system it is offered to. A release
  # that was never started once is a release nobody has seen work — and that has
  # bitten this project before (a fresh store crashed the bridge on its first
  # request).
  paket:
    needs: build
    name: start the package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: release-paket, path: dist }

      - name: Unpack (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -e
          mkdir -p pruefung
          unzip -q "$(ls dist/*.zip | head -1)" -d pruefung

      - name: Unpack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName
          Expand-Archive -Path $zip -DestinationPath pruefung -Force

      - name: Start it the way a recipient does
        shell: bash
        run: |
          set -e
          cd "pruefung/$(ls pruefung | head -1)"
          node tools/plattform-start.mjs

  veroeffentlichen:
    needs: paket
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: release-paket, path: dist }

      - name: Extract changelog section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog section for ${VERSION}; using a generic note." >&2
            printf 'Release %s. See CHANGELOG.md for details.\n' "${GITHUB_REF_NAME}" > release_notes.md
          fi

      - name: Attach release package
        # Pinned to a full commit SHA. A moving tag on a third-party action is a
        # supply-chain risk — CodeQL flags it as actions/unpinned-tag.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
