name: release

on:
  push:
    tags: ["v*"]

# Least privilege at workflow level; the job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }

      - name: Build package (schema, legal audit, protected-term scan)
        env:
          PRIVATE_TERMS_REGEX: ${{ secrets.PRIVATE_TERMS_REGEX }}
        run: node tools/build-release.mjs --version "${GITHUB_REF_NAME}" --out dist

      - name: Unpack the package and run the suite against it
        # The thing that ships, not the working tree. A release that was never
        # started once is a release nobody has seen work — and the difference
        # between the two has bitten this project before (a fresh store crashed
        # the bridge on its first request).
        run: |
          set -e
          mkdir -p pruefung && cd pruefung
          ZIP=$(ls ../dist/*.zip | head -1)
          unzip -q "$ZIP"
          PAKET=$(ls -d */ | head -1)
          cd "$PAKET"
          node -e "process.exit(require('fs').existsSync('bridge/bridge.mjs') ? 0 : 1)"
          # Start it exactly as a recipient would, and check it answers.
          node bridge/bridge.mjs --no-llm --port 8931 --store .store-test &
          BRIDGE=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8931/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8931/api/health | tee health.json
          node -e "const h=require('./health.json'); if(!h.ok) { console.error('health not ok'); process.exit(1); }"
          curl -sf http://127.0.0.1:8931/ | grep -q "AI-Act-Akademie" || { echo "app not served"; exit 1; }
          kill $BRIDGE || true

      - name: Extract changelog section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog section for ${VERSION}; using a generic note." >&2
            printf 'Release %s. See CHANGELOG.md for details.\n' "${GITHUB_REF_NAME}" > release_notes.md
          fi

      - name: Attach release package
        # Pinned to a full commit SHA. A moving tag on a third-party action is a
        # supply-chain risk — CodeQL flags it as actions/unpinned-tag.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
