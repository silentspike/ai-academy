name: auto-label

# Applies triage labels to new issues and pull requests so nothing sits
# unclassified.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-label-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label new issues
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Issue templates already carry type labels; only add triage if empty.
          existing=$(gh issue view ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --json labels --jq '.labels | length')
          if [ "$existing" -eq 0 ]; then
            gh issue edit ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} --add-label "status:triage"
          fi

      - name: Label pull requests by title prefix
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            feat*)     label="type:feature" ;;
            fix*)      label="type:bug" ;;
            docs*)     label="type:docs" ;;
            perf*)     label="type:perf" ;;
            refactor*) label="type:refactor" ;;
            test*)     label="type:chore" ;;
            ci*|build*) label="type:ci" ;;
            deps*)     label="type:deps" ;;
            security*) label="type:security" ;;
            content*)  label="type:content" ;;
            legal*)    label="type:legal" ;;
            *)         label="type:chore" ;;
          esac
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --add-label "$label,status:review"
