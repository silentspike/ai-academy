<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Act-Akademie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2334d399'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230a0e17'/%3E%3Cpath d='M8 24 L16 7 L24 24 M11.5 18.5 h9' stroke='url(%23g)' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app/styles.css">
<style>
  /* Nur Seitenlayout — Farben, Typografie und Karten kommen aus styles.css.
     Diese Seite hatte einen eigenen Token-Satz (#0a0e17 statt #070a10, #34d399
     statt #65d8b2, system-ui statt der Schrift-Trias): dasselbe Produkt in einer
     zweiten Gestaltung. Token werden nie lokal überschrieben (DESIGN-SYSTEM). */
  body { min-height:100vh; display:grid; place-items:center; padding:2rem; }
  .sc-karte { max-width:44rem; width:100%; padding:2.2rem 2.4rem; }
  h1 { font-size:var(--fs-xl); background:var(--grad-brand);
       -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:.35rem; }
  .sub { color:var(--dim); margin-bottom:1.6rem; font-size:.9rem; line-height:1.6; max-width:60ch; }
  .check { display:flex; gap:.8rem; align-items:baseline; padding:.6rem 0;
           border-bottom:1px solid var(--line); font-size:.9rem; }
  .check:last-of-type { border-bottom:0; }
  .dot { width:.6rem; height:.6rem; border-radius:50%; flex:none; align-self:center; }
  .ok .dot      { background:var(--emerald); box-shadow:0 0 0 3px rgba(101,216,178,.14); }
  .warn .dot    { background:var(--amber);   box-shadow:0 0 0 3px rgba(225,173,88,.14); }
  .fail .dot,
  .blocked .dot { background:var(--red);     box-shadow:0 0 0 3px rgba(217,117,104,.14); }
  .skipped .dot { background:var(--faint); }
  .lbl { min-width:15rem; font-weight:500; }
  .det { color:var(--faint); font-size:.8rem; }
  #ampel { margin:1.4rem 0 0; padding:.85rem 1.1rem; border-radius:10px; font-weight:600;
           font-family:var(--font-display); font-size:.95rem; border:1px solid transparent; }
  #ampel.ok      { background:rgba(101,216,178,.08); color:var(--emerald); border-color:rgba(101,216,178,.3); }
  #ampel.warn    { background:rgba(225,173,88,.08);  color:var(--amber);   border-color:rgba(225,173,88,.3); }
  #ampel.blocked,
  #ampel.fail    { background:rgba(217,117,104,.08); color:var(--red);     border-color:rgba(217,117,104,.32); }
  .btns { display:flex; gap:.6rem; margin-top:1.4rem; flex-wrap:wrap;
          padding-top:1.2rem; border-top:1px solid var(--line); }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="bg-layers"><div class="bg-aurora a"></div><div class="bg-aurora b"></div><div class="bg-aurora c"></div><div class="bg-grid"></div><div class="bg-vignette"></div></div>
<div class="card sc-karte">
  <h1>AI-Act-Akademie</h1>
  <div class="sub">Self-Check (Plan §5.6) — vor dem ersten Lernen. Es antwortet ein KI-System;
    Bewertungen tragen Modell- und Rubrik-Label (Art.-50-Transparenz).</div>
  <div id="checks">Self-Check läuft …</div>
  <div id="ampel"></div>
  <div class="btns">
    <button id="btn-recheck">Self-Check erneut</button>
    <button id="btn-diag">Diagnose-Export</button>
    <button id="btn-export">Lernstand exportieren</button>
    <button id="btn-import">Lernstand importieren</button>
    <input type="file" id="file-import" accept="application/json">
  </div>
</div>
<script>window.BRIDGE_TOKEN = '__BRIDGE_TOKEN__';</script>
<script type="module">
  import { LlmAdapter } from './app/llm-adapter.js';
  import { StorageAdapter } from './app/storage-adapter.js';
  import { runSelfCheck, buildDiagnoseExport } from './app/selfcheck.js';

  const llm = new LlmAdapter({});
  // Backend choice: the bridge store when the bridge answers, otherwise local storage.
  let storage = StorageAdapter.bridgeStore({});
  let lastResult = null;

  const AMPEL_TEXT = {
    ok: 'GRÜN — alles bereit. Viel Erfolg!',
    warn: 'GELB — nutzbar, mit Einschränkungen (Details oben).',
    blocked: 'ROT — Prüfungen GESPERRT (Frontier-Gate). Lernen mit deterministischen Teilen möglich.',
    fail: 'ROT — Grundfunktion gestört. Diagnose-Export an deinen Setup-Agent geben.',
  };

  async function run() {
    document.getElementById('checks').textContent = 'Self-Check läuft …';
    try { await llm.refreshHealth(); } catch { storage = StorageAdapter.localStorage(); }
    lastResult = await runSelfCheck({ llm, storage });
    document.getElementById('checks').innerHTML = lastResult.checks.map(c =>
      `<div class="check ${c.status}"><span class="dot"></span><span class="lbl">${c.label}</span><span class="det">${c.detail}</span></div>`).join('');
    const a = document.getElementById('ampel');
    a.className = lastResult.ampel;
    a.textContent = AMPEL_TEXT[lastResult.ampel];
    a.dataset.summative = String(lastResult.summativeAllowed);
  }

  document.getElementById('btn-recheck').onclick = run;
  document.getElementById('btn-diag').onclick = () => {
    const diag = buildDiagnoseExport({ selfCheckResult: lastResult, health: llm.health });
    new StorageAdapter({ }).constructor; // noop
    const blob = new Blob([JSON.stringify(diag, null, 1)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = 'akademie-diagnose.json'; link.click();
    URL.revokeObjectURL(link.href);
  };
  document.getElementById('btn-export').onclick = async () => {
    alert('Hinweis: Der Export enthält deine Antworten und Notizen — gib die Datei nur weiter, wenn du das willst.');
    storage.downloadExport(await storage.exportAll());
  };
  document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
  document.getElementById('file-import').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    await storage.importAll(JSON.parse(await f.text()));
    alert('Import abgeschlossen.');
  };

  run();
</script>
</body>
</html>
