<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Act-Akademie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2334d399'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230a0e17'/%3E%3Cpath d='M8 24 L16 7 L24 24 M11.5 18.5 h9' stroke='url(%23g)' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app/styles.css">
<style>
  /* Nur Seitenlayout — Farben, Typografie und Karten kommen aus styles.css.
     Diese Seite hatte einen eigenen Token-Satz (#0a0e17 statt #070a10, #34d399
     statt #65d8b2, system-ui statt der Schrift-Trias): dasselbe Produkt in einer
     zweiten Gestaltung. Token werden nie lokal überschrieben (DESIGN-SYSTEM). */
  body { min-height:100vh; display:grid; place-items:center; padding:2rem; }
  .sc-karte { max-width:44rem; width:100%; padding:2.2rem 2.4rem; }
  h1 { font-size:var(--fs-xl); background:var(--grad-brand);
       -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:.35rem; }
  .sub { color:var(--dim); margin-bottom:1.6rem; font-size:.9rem; line-height:1.6; max-width:60ch; }
  .check { display:flex; gap:.8rem; align-items:center; padding:.6rem 0;
           border-bottom:1px solid var(--line); font-size:.9rem; }
  .check:last-of-type { border-bottom:0; }
  /* Der Zustand stand als farbiger Punkt da — dieselbe Form fuer bestanden,
     gewarnt und gescheitert. Jetzt traegt jede Zeile ihr Zeichen. */
  .check .ut-sym { flex:none; width:1.05rem; height:1.05rem; }
  .ok .ut-sym      { color:var(--emerald); }
  .warn .ut-sym    { color:var(--amber); }
  .fail .ut-sym,
  .blocked .ut-sym { color:var(--red); }
  .skipped .ut-sym { color:var(--faint); }
  .lbl { min-width:15rem; font-weight:500; }
  .det { color:var(--faint); font-size:.8rem; }
  /* Die Ampel war ein Textstreifen, der ihre Farbe im Wort wiederholte
     („GRUEN — …"). Jetzt Zeichen, Aussage, und bei Gruen der Weg weiter. */
  #ampel { display:flex; gap:.8rem; align-items:center; margin:1.4rem 0 0;
           padding:.85rem 1.1rem; border-radius:10px; border:1px solid transparent; }
  #ampel .ut-sym { flex:none; width:1.4rem; height:1.4rem; }
  #ampel b { font-family:var(--font-display); font-size:.95rem; display:block; }
  #ampel p { margin:.15rem 0 0; font-size:.83rem; color:var(--dim); }
  #ampel .a-txt { flex:1; }
  #ampel.ok      { background:rgba(101,216,178,.08); color:var(--emerald); border-color:rgba(101,216,178,.3); }
  #ampel.warn    { background:rgba(225,173,88,.08);  color:var(--amber);   border-color:rgba(225,173,88,.3); }
  #ampel.blocked,
  #ampel.fail    { background:rgba(217,117,104,.08); color:var(--red);     border-color:rgba(217,117,104,.32); }
  .btns { display:flex; gap:.6rem; margin-top:1.4rem; flex-wrap:wrap;
          padding-top:1.2rem; border-top:1px solid var(--line); }
  input[type=file] { display:none; }
  #datei-hinweis { display:flex; gap:.7rem; align-items:flex-start; margin-top:1rem;
    padding:.7rem .9rem; border-radius:10px; font-size:.85rem; line-height:1.55;
    border:1px solid var(--line); background:rgba(151,169,202,.04); color:var(--dim); }
  #datei-hinweis .ut-sym { flex:none; width:1.1rem; height:1.1rem; margin-top:.12rem; }
  #datei-hinweis.gut  { border-color:rgba(101,216,178,.3); background:rgba(101,216,178,.06); }
  #datei-hinweis.gut .ut-sym  { color:var(--emerald); }
  #datei-hinweis.acht { border-color:rgba(225,173,88,.3);  background:rgba(225,173,88,.06); }
  #datei-hinweis.acht .ut-sym { color:var(--amber); }
  #datei-hinweis.schlecht { border-color:rgba(217,117,104,.32); background:rgba(217,117,104,.06); }
  #datei-hinweis.schlecht .ut-sym { color:var(--red); }
</style>
</head>
<body>
<div class="bg-layers"><div class="bg-aurora a"></div><div class="bg-aurora b"></div><div class="bg-aurora c"></div><div class="bg-grid"></div><div class="bg-vignette"></div></div>
<div class="card sc-karte">
  <h1>AI-Act-Akademie</h1>
  <div class="sub">Die Selbstprüfung — sie läuft einmal vor dem ersten Lernen und sagt dir,
    ob alles bereit ist. In dieser Akademie antwortet ein KI-Modell; jede Bewertung ist
    mit Modell, Rubrikfassung und Rechtsstand gekennzeichnet.</div>
  <div id="checks">Die Prüfung läuft …</div>
  <div id="ampel"></div>
  <div class="btns">
    <button id="btn-recheck">Noch einmal prüfen</button>
    <button id="btn-diag">Diagnose-Datei speichern</button>
    <button id="btn-export">Lernstand exportieren</button>
    <button id="btn-import">Lernstand importieren</button>
    <input type="file" id="file-import" accept="application/json">
  </div>
  <!-- Rückmeldung auf der Seite statt im Browser-Dialog: Ein Alert blockiert die
       Seite, verlässt die Gestaltung und ist beim Export der schlechteste Ort für
       einen Hinweis, den man lesen soll, bevor man die Datei weitergibt.
       Sie stand als grauer Fließtext in derselben Klasse wie der Einleitungssatz —
       also nicht als Antwort auf eine Handlung erkennbar. Jetzt eine eigene Zeile
       mit Zeichen und Ton. -->
  <div id="datei-hinweis" role="status" hidden></div>
</div>
<script>window.BRIDGE_TOKEN = '__BRIDGE_TOKEN__';</script>
<script type="module">
  import { LlmAdapter } from './app/llm-adapter.js';
  import { StorageAdapter } from './app/storage-adapter.js';
  import { runSelfCheck, buildDiagnoseExport } from './app/selfcheck.js';

  const llm = new LlmAdapter({});
  // Backend choice: the bridge store when the bridge answers, otherwise local storage.
  let storage = StorageAdapter.bridgeStore({});
  let lastResult = null;

  // Die Farbe steht im Rand — im Text stand sie noch einmal als Wort („GRÜN — …").
  // Jetzt: Zeichen, ein Satz, was das bedeutet, und bei Grün der Weg hinein.
  const AMPEL = {
    ok:      ['icon-st-check',  'Alles bereit',            'Verbindung, Modell, Bewertung und Speicher haben bestanden.'],
    warn:    ['icon-st-warn',   'Nutzbar, mit Abstrichen', 'Eine Prüfung ist nicht sauber durchgelaufen — die Zeile darüber sagt, welche.'],
    blocked: ['icon-st-lock',   'Prüfungen sind gesperrt', 'Das verbundene Modell wird nicht unterstützt. Lernen geht, Prüfungen zählen nicht.'],
    fail:    ['icon-st-x',      'Etwas Grundlegendes fehlt', 'Speichere die Diagnose-Datei und gib sie deinem Einrichtungs-Agenten.'],
  };

  const ZEICHEN = { ok: 'icon-st-check', warn: 'icon-st-warn', blocked: 'icon-st-lock',
                    fail: 'icon-st-x', skipped: 'icon-act-weiter' };
  const sym = (id, klasse = 'ut-sym') =>
    `<svg class="${klasse}" aria-hidden="true"><use href="assets/icons/sprite.svg#${id}"/></svg>`;

  async function run() {
    document.getElementById('checks').textContent = 'Die Prüfung läuft …';
    try { await llm.refreshHealth(); } catch { storage = StorageAdapter.localStorage(); }
    lastResult = await runSelfCheck({ llm, storage });
    document.getElementById('checks').innerHTML = lastResult.checks.map(c =>
      `<div class="check ${c.status}">${sym(ZEICHEN[c.status] ?? 'icon-st-info')}<span class="lbl">${c.label}</span><span class="det">${c.detail}</span></div>`).join('');
    const a = document.getElementById('ampel');
    const [ikon, titel, satz] = AMPEL[lastResult.ampel];
    a.className = lastResult.ampel;
    a.innerHTML = `${sym(ikon)}<span class="a-txt"><b>${titel}</b><p>${satz}</p></span>` +
      // Der Hauptknopf traegt die Farbe der Akademie — in einer roten Lage
      // wuerde er der Lage widersprechen; dort ist es ein normaler Knopf.
      (lastResult.ampel === 'fail' ? ''
        : `<a class="${lastResult.ampel === 'ok' ? 'btn-primary' : 'btn'}" href="index.html">Zur Akademie</a>`);
    a.dataset.summative = String(lastResult.summativeAllowed);
  }

  document.getElementById('btn-recheck').onclick = run;
  document.getElementById('btn-diag').onclick = () => {
    const diag = buildDiagnoseExport({ selfCheckResult: lastResult, health: llm.health });
    new StorageAdapter({ }).constructor; // noop
    const blob = new Blob([JSON.stringify(diag, null, 1)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = 'akademie-diagnose.json'; link.click();
    URL.revokeObjectURL(link.href);
    // Der Knopf tat sichtbar nichts — die Datei landet im Download-Ordner, ohne dass
    // die Seite es bestaetigt. Genau dieser Knopf wird im Stoerfall gebraucht.
    melde('gut', 'Diagnose gespeichert als „akademie-diagnose.json" — sie enthält keine Zugangsdaten und keine Lerninhalte. Gib sie deinem Einrichtungs-Agenten.');
  };
  const TON = { gut: 'icon-st-check', acht: 'icon-st-warn', schlecht: 'icon-st-x' };
  const melde = (ton, text) => {
    const el = document.getElementById('datei-hinweis');
    el.className = ton;
    // Der Text kann aus der Umgebung stammen — der Name einer gewaehlten Datei
    // waere sonst Markup, das die Seite ausfuehrt. Zeichen als Knoten, Text als
    // Text: dann gibt es nichts zu deuten.
    el.replaceChildren();
    el.insertAdjacentHTML('beforeend', sym(TON[ton]));
    const huelle = document.createElement('span');
    huelle.textContent = text;
    el.appendChild(huelle);
    el.hidden = false;
  };
  document.getElementById('btn-export').onclick = async () => {
    storage.downloadExport(await storage.exportAll());
    melde('acht', 'Datei gespeichert. Sie enthält deine Antworten und Notizen — gib sie nur weiter, wenn du das willst.');
  };
  document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
  document.getElementById('file-import').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    // Eine fremde oder beschaedigte Datei liess das Einlesen unbehandelt scheitern:
    // der Knopf tat sichtbar nichts, und niemand erfuhr warum.
    try {
      await storage.importAll(JSON.parse(await f.text()));
      melde('gut', 'Lernstand übernommen — die Akademie startet ab jetzt mit dem Stand aus dieser Datei.');
    } catch {
      melde('schlecht', `„${f.name}" lässt sich nicht lesen. Erwartet wird die Datei, die „Lernstand exportieren" erzeugt hat.`);
    } finally {
      e.target.value = '';                 // dieselbe Datei laesst sich sonst kein zweites Mal waehlen
    }
  };

  run();
</script>
</body>
</html>
